const label=s=>names[s]||s;let records=new Map();
function value(v){if(v===null||v===undefined)return '未说明';if(typeof v==='boolean')return v?'是':'否';if(Array.isArray(v))return v.length?v.map(value).join('；'):'无';if(typeof v==='object')return Object.entries(v).map(([k,x])=>label(k)+'：'+value(x)).join('\n');const n=records.get(v)||index.get(v);return n&&(n.properties?.name||n.name)?(n.properties?.name||n.name)+' ['+v+']':label(v)}

if(entityThemes.length)out+=section('按主题整理的条件与建议 · '+entityThemes.length,'<p class="muted">以下内容由同一实体的多条历史记录归纳，供规划时快速检索；每条都保留原始记录ID，可展开追溯。当前有效性尚未核实。</p>'+entityThemes.map(t=>'<details><summary>'+esc(t.label)+'</summary><p>'+esc(t.summary)+'</p>'+kv({主题ID:t.topic_id,景区:t.scenic_code,来源记录:t.source_record_ids,原始汇总ID:t.advice_summary_id,当前有效性已核实:t.current_validity_verified})+'</details>').join(''));

if(rules.length)out+=section('条件、建议与限制 · '+rules.length,rules.map(r=>recordCard(r,r.properties.consequence_text||r.properties.condition?.text||r.id)).join(''));

if(steps.length)out+=section('有序线路步骤 · '+steps.length,'<p class="muted">保留重复访问；同一步内多个地点不额外推断先后。</p>'+steps.map(r=>{const s=r.properties;return '<details><summary>'+esc(s.index+'. '+(s.extracted_texts?.join('；')||s.evidence?.text||s.poi_ids?.map(value).join('、')||r.id))+'</summary>'+kv({step_id:r.id,day:s.time?.day,order_group:s.order_group,targets:s.poi_ids||[],transport_entity_id:s.transport_ids||[],time:s.time,durations:s.durations})+'</details>'}).join(''));

const obs=all.filter(r=>r.label==='OBSERVATION');if(p.source_evidence?.length)out+=section('线路原文片段',p.source_evidence.map(s=>'<details><summary>'+esc(s.doc_id||'原文')+'</summary>'+kv(s)+'</details>').join(''));
if(obs.length)out+=section('来源证据 · '+obs.length,obs.map(r=>{const q=r.properties.provenance||{};const doc=r.properties.display_source||{};let text='<div class="id">'+esc(r.id)+'</div>'+kv({来源文本:q.doc_id,标题:doc.title||'未提供',证据精度:q.evidence_precision,原文包范围:q.blocks});if(doc.excerpts?.length)text+='<blockquote>'+esc(doc.excerpts.join('\n\n'))+'</blockquote>';if(q.source_url&&/^https?:\/\//i.test(q.source_url))text+='<a target="_blank" rel="noopener noreferrer" href="'+esc(q.source_url)+'">查看来源网页</a>';return '<details><summary>'+esc((q.doc_id||'来源')+' · '+r.properties.tool_name)+'</summary>'+text+'</details>'}).join(''));
out+='<details><summary>完整节点字段 JSON</summary><pre>'+esc(JSON.stringify(p,null,2))+'</pre></details>';info.innerHTML=out;info.scrollTop=0;info.querySelectorAll('[data-node]').forEach(b=>b.onclick=()=>showNode(b.dataset.node));draw()}
for(const [kind,color] of Object.entries(colors)){const l=document.createElement('label'),box=document.createElement('input');box.type='checkbox';box.checked=true;box.onchange=()=>{box.checked?enabled.add(kind):enabled.delete(kind);draw()};l.style.color=color;l.append(box,document.createTextNode(label(kind)));document.getElementById('filters').append(l)}
function point(n){return {x:W/2+dx+n.x*Math.min(W,H)*.43*zoom,y:H/2+dy+n.y*Math.min(W,H)*.43*zoom}}function visible(n){return enabled.has(n.label)}
function draw(){ctx.clearRect(0,0,W,H);const term=document.getElementById('search').value.trim();let hits=0;for(const e of view.edges){const a=index.get(e.source),b=index.get(e.target);if(!visible(a)||!visible(b))continue;const p=point(a),q=point(b),active=e.source===selected||e.target===selected;ctx.strokeStyle=edgeColors[e.type]||'#ccc';ctx.globalAlpha=selected?(active?.9:.1):.4;ctx.lineWidth=active?1.8:.7;ctx.beginPath();ctx.moveTo(p.x,p.y);ctx.lineTo(q.x,q.y);ctx.stroke();const angle=Math.atan2(q.y-p.y,q.x-p.x),r=b.label==='POI'?5:3;const ex=q.x-Math.cos(angle)*r,ey=q.y-Math.sin(angle)*r;ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(ex-Math.cos(angle-.4)*6,ey-Math.sin(angle-.4)*6);ctx.lineTo(ex-Math.cos(angle+.4)*6,ey-Math.sin(angle+.4)*6);ctx.closePath();ctx.fillStyle=ctx.strokeStyle;ctx.fill()}ctx.globalAlpha=1;for(const n of view.nodes){if(!visible(n))continue;const p=point(n),hit=term&&(n.name.includes(term)||n.id.includes(term));if(hit)hits++;ctx.beginPath();ctx.arc(p.x,p.y,(n.label==='POI'?5:3)+(hit||n.id===selected?3:0),0,2*Math.PI);ctx.fillStyle=hit?'#d83b47':colors[n.label];ctx.fill();if((n.label==='POI'&&zoom>1.3)||hit||n.id===selected){ctx.font='12px system-ui';ctx.fillStyle='#172a3a';ctx.fillText(n.name,p.x+7,p.y-4)}}document.getElementById('status').textContent=term?'搜索命中 '+hits+' 个可见节点':'显示 '+view.nodes.filter(visible).length+' 个主体节点 · 点击圆点查看详情'}
function resize(){W=canvas.clientWidth;H=canvas.clientHeight;const dpr=devicePixelRatio||1;canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);draw()}window.onresize=resize;document.getElementById('search').oninput=draw;canvas.onwheel=e=>{e.preventDefault();zoom=Math.max(.3,Math.min(12,zoom*Math.exp(-e.deltaY*.001)));draw()};canvas.onpointerdown=e=>{drag=false;last={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(!last)return;const mx=e.clientX-last.x,my=e.clientY-last.y;if(Math.abs(mx)+Math.abs(my)>1)drag=true;dx+=mx;dy+=my;last={x:e.clientX,y:e.clientY};draw()};canvas.onpointerup=e=>{last=null;if(drag)return;const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;const hit=view.nodes.filter(visible).find(n=>{const p=point(n);return Math.hypot(p.x-x,p.y-y)<10});if(hit)showNode(hit.id)};canvas.onpointercancel=()=>{last=null};resize();
