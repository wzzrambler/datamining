name: 自检

# 三人各改各的时候，最容易出的事故是「动了数据忘了同步报告」。
# 每次推送自动跑一遍 verify.py，数字对不上就让这次提交显示红叉。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 语法检查
        run: python -m compileall -q src tools

      - name: 报告数字与产物一致性
        run: python src/verify.py
