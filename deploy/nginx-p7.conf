# P7 的 Nginx 反代配置
#
# 安装：
#   sudo cp deploy/nginx-p7.conf /etc/nginx/sites-available/p7
#   sudo ln -s /etc/nginx/sites-available/p7 /etc/nginx/sites-enabled/p7
#   sudo nano /etc/nginx/sites-available/p7      # 改 server_name
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d p7.example.com       # 自动改成 443
#
# 关键点：SSE 必须关缓冲，否则前端会等全部跑完才一次性显示。

server {
    listen 80;
    listen [::]:80;
    server_name p7.example.com;

    # 请求体只有一句需求，不需要大上传
    client_max_body_size 64k;

    # SSE 端点用 ?token= 传口令（EventSource 发不了自定义头），需求也在 ?query= 里。
    # 开着 access_log 会把访问口令明文写进日志文件，所以默认关掉。
    # 确需日志时请自定义 log_format，去掉 $request 里的查询串。
    access_log off;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 只有一层反代：覆盖而不是追加，否则客户端自带的 X-Forwarded-For
        # 会被保留在最前面，换一个值就能绕过按 IP 的限流
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # SSE：逐轮推送靠这三行
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;

        # 页面没有文件名指纹，交给浏览器每次校验
        add_header Cache-Control "no-cache";
    }
}
