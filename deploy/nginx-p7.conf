# P7 的 Nginx 反代配置
#
# 安装：
#   sudo cp deploy/nginx-p7.conf /etc/nginx/sites-available/p7
#   sudo ln -s /etc/nginx/sites-available/p7 /etc/nginx/sites-enabled/p7
#   sudo nano /etc/nginx/sites-available/p7      # 改 server_name
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d p7.example.com       # 自动改成 443
#
# 关键点：SSE 必须关缓冲，否则前端会等全部跑完才一次性显示。

server {
    listen 80;
    listen [::]:80;
    server_name p7.example.com;

    # 请求体只有一句需求，不需要大上传
    client_max_body_size 64k;

    # 访问日志的 URL 会带 ?query=（用户输入）。介意就改成 access_log off;
    access_log /var/log/nginx/p7.access.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE：逐轮推送靠这三行
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header X-Accel-Buffering no;

        # 页面没有文件名指纹，交给浏览器每次校验
        add_header Cache-Control "no-cache";
    }
}
